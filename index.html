<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shristi Poudel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .name-font {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-16">
        <div class="text-center">
            <!-- Main Name -->
            <h1 class="name-font text-5xl md:text-7xl font-medium mb-6 tracking-tight">
                SHRISTI <span class="text-gray-300">POUDEL</span>
            </h1>
            
            <!-- Subtitle -->
            <p class="text-xl md:text-2xl text-gray-300 mb-10 max-w-2xl mx-auto">
                Creating meaningful experiences through design and innovation
            </p>
            
            <!-- Call to Action Buttons -->
            <div class="flex flex-col sm:flex-row justify-center gap-4 mb-16">
                <button class="bg-white text-black px-8 py-3 rounded-md font-medium hover:bg-gray-200 transition duration-300">
                    View My Work
                </button>
                <button class="border border-white px-8 py-3 rounded-md font-medium hover:bg-white hover:text-black transition duration-300">
                    Get In Touch
                </button>
            </div>
            
            <!-- Social Links -->
            <div class="flex justify-center space-x-6">
                <a href="#" class="text-gray-400 hover:text-white transition duration-300">
                    LinkedIn
                </a>
                <a href="#" class="text-gray-400 hover:text-white transition duration-300">
                    GitHub
                </a>
                <a href="#" class="text-gray-400 hover:text-white transition duration-300">
                    Twitter
                </a>
                <a href="#" class="text-gray-400 hover:text-white transition duration-300">
                    Instagram
                </a>
            </div>
        </div>
    </div>

    <script>
        // Simple fade-in animation
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('h1, p, .flex');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    el.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, index * 200);
            });
        });
    </script>
</body>
</html>
